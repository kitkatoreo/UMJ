<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letters & Requests | UMJ Student Portal</title>
  <meta name="description" content="Apply for leave, continue studies, transcripts, confirmation letters and other student letters.">
  <meta name="keywords" content="UMJ, student portal, apply leave, continue studies, transcript, letter request">
  <meta name="author" content="IMS566 Individual Project">
  <meta name="theme-color" content="#0b1f5c">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css?v=3" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="app-navbar"></header>
<main class="container pb-2" id="main">

  <section class="page-head"><h1 class="h2">Letters &amp; requests</h1><p>Pick a letter template. Your details are already filled in - you only add your name or signature.</p></section>
  <div id="reqMsg" class="alert alert-success d-none" role="status"></div>

  <!-- Request types -->
  <section class="row g-3 mb-3" id="typeGrid" aria-label="Request types"></section>

  <!-- Tracker -->
  <section class="row g-3" aria-label="My requests">
    <div class="col-lg-8"><div class="panel">
      <h2>My requests</h2><p class="sub">Open any signed letter to view or print it</p>
      <div class="table-responsive-sm"><table class="table table-hover umj-table stack-table">
        <caption class="visually-hidden">My requests</caption>
        <thead><tr><th scope="col">Reference</th><th scope="col">Request</th><th scope="col">Submitted</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Action</span></th></tr></thead>
        <tbody id="reqRows"></tbody></table></div>
    </div></div>
    <div class="col-lg-4"><div class="panel">
      <h2>Requests by status</h2><p class="sub">All your requests</p>
      <div class="chart-box"><canvas id="statusChart" role="img" aria-label="Doughnut chart of requests by status"></canvas></div></div></div>
  </section>
</main>

<!-- Request form (filled by letters.js) -->
<div class="modal fade" id="reqModal" tabindex="-1" aria-labelledby="reqTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" id="reqForm" novalidate>
      <div class="modal-header"><h2 class="modal-title h5" id="reqTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="reqBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="reqSubmit">Sign &amp; submit</button></div>
    </form>
  </div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="../js/data.js?v=3"></script>
<script src="../js/app.js?v=3"></script>
<script src="../js/letters.js?v=3"></script>
</body>
</html>
